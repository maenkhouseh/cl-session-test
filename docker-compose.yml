# Local infrastructure only — run the apps themselves with `php artisan serve` and `npm run dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shortie
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: shortie
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortie"]
      interval: 5s
      retries: 10
    # Test database is created by the init script below.
    configs:
      - source: init_test_db
        target: /docker-entrypoint-initdb.d/10-test-db.sql

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:

configs:
  init_test_db:
    content: |
      CREATE DATABASE shortie_test OWNER shortie;
      \c shortie
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
      \c shortie_test
      CREATE EXTENSION IF NOT EXISTS pg_trgm;
